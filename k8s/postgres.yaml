# Backend de persistencia de Polaris (relational-jdbc)
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: lakehouse
data:
  01-schema.sql: |
    -- Polaris usa currentSchema=POLARIS_SCHEMA (sin comillas -> polaris_schema); debe existir antes
    CREATE SCHEMA IF NOT EXISTS polaris_schema;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: lakehouse
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - { name: POSTGRES_DB, value: polaris }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: polaris-db, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: polaris-db, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: pg, containerPort: 5432 }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d polaris"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lakehouse
spec:
  selector: { app: postgres }
  ports:
    - { name: pg, port: 5432, targetPort: 5432 }
