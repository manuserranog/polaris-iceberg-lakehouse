apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: iceberg-access
  namespace: spark-jobs
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: spark-iceberg:3.5
  imagePullPolicy: Never              # imagen construida dentro de minikube
  mainApplicationFile: local:///opt/jobs/iceberg_access_check.py
  sparkVersion: "3.5.9"
  restartPolicy:
    type: Never
  sparkConf:
    spark.ui.showConsoleProgress: "false"
  volumes:
    - name: jobs
      configMap: { name: lakehouse-jobs }
  driver:
    cores: 1
    memory: 1g
    serviceAccount: spark
    envFrom:
      - secretRef: { name: s3-creds }             # claves S3 (como las de Scality)
      - secretRef: { name: polaris-spark-creds }  # POLARIS_CREDENTIAL=client_id:secret
    volumeMounts:
      - { name: jobs, mountPath: /opt/jobs }
  executor:
    instances: 1
    cores: 1
    memory: 1g
    envFrom:
      - secretRef: { name: s3-creds }
    volumeMounts:
      - { name: jobs, mountPath: /opt/jobs }
