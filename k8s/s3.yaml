# Almacenamiento S3-compatible que hace de Scality en local.
# SeaweedFS: endpoint propio + path-style, igual que Scality RING/ARTESCA.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: lakehouse
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels: { app: seaweedfs }
  template:
    metadata:
      labels: { app: seaweedfs }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
            - -master.volumeSizeLimitMB=256
            - -volume.max=0
          ports:
            - { name: s3, containerPort: 8333 }
          readinessProbe:
            tcpSocket: { port: 8333 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-config, mountPath: /etc/seaweedfs, readOnly: true }
      volumes:
        - name: s3-config
          secret:
            secretName: s3-creds
            items: [{ key: s3.json, path: s3.json }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: lakehouse
spec:
  selector: { app: seaweedfs }
  ports:
    - { name: s3, port: 8333, targetPort: 8333 }
---
# Crea el bucket "warehouse" (equivalente al bucket del lake en Scality)
apiVersion: batch/v1
kind: Job
metadata:
  name: create-bucket
  namespace: lakehouse
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws
          image: amazon/aws-cli:2.38.1
          envFrom:
            - secretRef: { name: s3-creds }
          command: ["/bin/sh", "-c"]
          args:
            - |
              until aws --endpoint-url http://seaweedfs:8333 s3 ls >/dev/null 2>&1; do echo "esperando S3..."; sleep 3; done
              aws --endpoint-url http://seaweedfs:8333 s3 mb s3://warehouse || true
              aws --endpoint-url http://seaweedfs:8333 s3 ls
