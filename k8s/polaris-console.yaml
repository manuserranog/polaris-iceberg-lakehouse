# Polaris Console (apache/polaris-tools/console): UI web del catálogo.
# No hay imagen oficial publicada: se construye con `make console-image`.
# El navegador llama a la API en localhost:8181 (port-forward), por eso CORS en helm/polaris-values.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris-console
  namespace: lakehouse
spec:
  replicas: 1
  selector:
    matchLabels: { app: polaris-console }
  template:
    metadata:
      labels: { app: polaris-console }
    spec:
      containers:
        - name: console
          image: polaris-console:local
          imagePullPolicy: Never
          env:
            - { name: VITE_POLARIS_API_URL, value: "http://localhost:8181" }
            - { name: VITE_OAUTH_TOKEN_URL, value: "http://localhost:8181/api/catalog/v1/oauth/tokens" }
            - { name: VITE_POLARIS_REALM, value: POLARIS }
            - { name: VITE_POLARIS_PRINCIPAL_SCOPE, value: "PRINCIPAL_ROLE:ALL" }
            - { name: VITE_POLARIS_REALM_HEADER_NAME, value: Polaris-Realm }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: polaris-console
  namespace: lakehouse
spec:
  selector: { app: polaris-console }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
