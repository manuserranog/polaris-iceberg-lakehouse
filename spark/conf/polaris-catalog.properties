# =====================================================================
# Configuración PORTABLE del catálogo Polaris (Iceberg REST).
# Este mismo bloque es el que va en:
#   - Spark on k8s (lo carga jobs/lakehouse_session.py)
#   - EMR       -> clasificación "spark-defaults"   (ver docs/emr.md)
#   - Databricks -> Spark config del cluster         (ver docs/databricks.md)
# Solo cambian uri/endpoint (DNS de cada entorno) y de dónde salen los secretos.
# =====================================================================
spark.sql.extensions                              org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

spark.sql.catalog.lake                            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                       rest
spark.sql.catalog.lake.uri                        http://polaris.lakehouse:8181/api/catalog
spark.sql.catalog.lake.warehouse                  lakehouse
spark.sql.catalog.lake.scope                      PRINCIPAL_ROLE:ALL
spark.sql.catalog.lake.token-refresh-enabled      true
# spark.sql.catalog.lake.credential = <client_id>:<client_secret>  -> se inyecta en runtime (secreto)

spark.sql.catalog.lake.io-impl                    org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint                http://seaweedfs.lakehouse:8333
spark.sql.catalog.lake.s3.path-style-access       true
spark.sql.catalog.lake.client.region              us-east-1
# Claves S3: cadena de credenciales AWS por defecto (env AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)

# Hadoop FS (s3a) para leer ficheros "legacy" (tablas Hive actuales) durante la migración.
# add_files (y otros procedures) escriben vía Hadoop FS con rutas s3://, así que mapeamos s3 -> S3A.
# OJO en EMR/Databricks con Scality: allí s3:// apunta a AWS S3 (EMRFS / FS de Databricks),
# por eso también hace falta este mapeo + el endpoint de Scality (ver docs/emr.md y docs/databricks.md).
spark.hadoop.fs.s3.impl                           org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                     http://seaweedfs.lakehouse:8333
spark.hadoop.fs.s3a.path.style.access             true
spark.hadoop.fs.s3a.connection.ssl.enabled        false
spark.hadoop.fs.s3a.aws.credentials.provider      com.amazonaws.auth.EnvironmentVariableCredentialsProvider
